<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="surgeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="surgeShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9"/>

  <!-- Main Voltage Protector Body -->
  <g filter="url(#surgeShadow)">
    <rect x="230" y="50" width="340" height="400" rx="40" fill="url(#surgeBody)" stroke="#334155" stroke-width="3.5"/>
    
    <!-- ZepTech Header Strip -->
    <rect x="260" y="75" width="280" height="40" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="285" y="101" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#38bdf8" letter-spacing="1.5">ZepTech DIGITAL GUARD</text>

    <!-- Digital 7-Segment Voltmeter Display -->
    <rect x="270" y="130" width="260" height="90" rx="18" fill="#020617" stroke="#10b981" stroke-width="2.5"/>
    <text x="320" y="195" font-family="monospace" font-size="60" font-weight="900" fill="#10b981" letter-spacing="4">224</text>
    <text x="460" y="175" font-family="monospace" font-size="26" font-weight="bold" fill="#10b981">V</text>
    <text x="450" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">50Hz RMS</text>

    <!-- 3 Status LED Indicators -->
    <g transform="translate(255, 240)">
      <!-- High Cut -->
      <circle cx="35" cy="15" r="9" fill="#ef4444" opacity="0.3"/>
      <circle cx="35" cy="15" r="5" fill="#f87171"/>
      <text x="50" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">HIGH</text>

      <!-- Normal Cut -->
      <circle cx="130" cy="15" r="9" fill="#10b981" opacity="0.4"/>
      <circle cx="130" cy="15" r="5" fill="#34d399"/>
      <text x="145" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">NORMAL</text>

      <!-- Low Cut -->
      <circle cx="225" cy="15" r="9" fill="#f59e0b" opacity="0.3"/>
      <circle cx="225" cy="15" r="5" fill="#fbbf24"/>
      <text x="240" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">LOW</text>
    </g>

    <!-- Universal 3-Pin Socket Front Bezel -->
    <circle cx="400" cy="355" r="60" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Earth Pin (Top) -->
    <rect x="393" y="318" width="14" height="20" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
    <!-- Neutral Pin (Left) -->
    <rect x="362" y="360" width="14" height="18" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
    <!-- Live Pin (Right) -->
    <rect x="424" y="360" width="14" height="18" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
    <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">20A / 4400W AUTO SURGE CUT</text>
  </g>
</svg>