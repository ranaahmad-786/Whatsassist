<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="microBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="microShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.22" flood-color="#000000"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  <g filter="url(#microShadow)">
    <!-- Main Outer Microwave Chassis -->
    <rect x="100" y="80" width="600" height="340" rx="26" fill="url(#microBody)" stroke="#475569" stroke-width="3"/>
    
    <!-- Left Glass Door Window -->
    <rect x="130" y="110" width="380" height="280" rx="18" fill="#020617" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Interior Cavity View -->
    <rect x="155" y="135" width="330" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="5,5"/>
    <ellipse cx="320" cy="335" rx="120" ry="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="450" cy="165" r="24" fill="#fbbf24" opacity="0.3"/>

    <!-- Door Vertical Chrome Handle -->
    <rect x="525" y="130" width="16" height="240" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

    <!-- Right Control Panel Column -->
    <rect x="555" y="110" width="125" height="280" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Digital Timer LED Screen -->
    <rect x="565" y="125" width="105" height="45" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="578" y="157" font-family="monospace" font-size="28" font-weight="900" fill="#10b981">02:30</text>

    <!-- Rotary Jog Dial Knob -->
    <circle cx="617" cy="225" r="28" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
    <line x1="617" y1="202" x2="617" y2="220" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Quick Function Buttons -->
    <rect x="570" y="275" width="95" height="24" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="583" y="291" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">AIR FRYER</text>

    <rect x="570" y="308" width="95" height="24" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="588" y="324" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">DEFROST</text>

    <rect x="570" y="342" width="95" height="32" rx="9" fill="#10b981" stroke="#059669"/>
    <text x="597" y="363" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">START</text>

    <!-- Brand Header -->
    <text x="135" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#e2e8f0" letter-spacing="1.5">Haier SMART INVERTER MICROWAVE &amp; AIR FRYER 25L</text>
  </g>
</svg>