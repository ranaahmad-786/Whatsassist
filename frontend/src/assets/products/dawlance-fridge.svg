<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fridgeChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="fridgeShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.22" flood-color="#000000"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  <g filter="url(#fridgeShadow)">
    <!-- Main Refrigerator Body -->
    <rect x="250" y="35" width="300" height="430" rx="26" fill="url(#fridgeChrome)" stroke="#475569" stroke-width="3"/>
    
    <!-- Top Freezer Door -->
    <rect x="260" y="45" width="280" height="145" rx="18" fill="url(#fridgeChrome)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="275" y="155" width="90" height="14" rx="7" fill="#334155" stroke="#1e293b"/>
    <text x="280" y="78" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#1e293b">Dawlance</text>
    <text x="280" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">91996 CHROME INVERTER</text>

    <!-- Bottom Refrigerator Door -->
    <rect x="260" y="200" width="280" height="255" rx="18" fill="url(#fridgeChrome)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="275" y="215" width="14" height="175" rx="7" fill="#334155" stroke="#1e293b"/>

    <!-- External Digital Touch Control Display on Door -->
    <rect x="445" y="225" width="85" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="458" y="250" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8">-18°C</text>
    <text x="458" y="278" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399">+04°C</text>

    <!-- A+ Inverter Badge -->
    <rect x="430" y="415" width="100" height="26" rx="8" fill="#10b981" opacity="0.2"/>
    <text x="442" y="433" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#047857">A+ INVERTER</text>
  </g>
</svg>